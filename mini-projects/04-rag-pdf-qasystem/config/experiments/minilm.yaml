# Focused 12-config grid: 4 chunkers x MiniLM x 3 retrievers.
# Runs quickly on CPU and satisfies the plan's "12+ configurations" target.
chunkers:
  - name: fixed
    params: { chunk_size: 256, overlap: 0 }
  - name: sliding
    params: { chunk_size: 256, overlap: 64 }
  - name: recursive
    params: { chunk_size: 512, overlap: 64 }
  - name: semantic
    params: { max_tokens: 384 }

embedders:
  - sentence-transformers/all-MiniLM-L6-v2

retrievers:
  - name: dense
  - name: bm25
  - name: hybrid
    params: { alpha: 0.5 }

rerankers: [null]

top_k: 10
k_values: [1, 3, 5, 10]
